<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 15 – NGỮ PHÁP - Flashcard</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#fdfbf7;
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(860px,96vw); padding:30px 0 40px}
h1{text-align:center;margin:0 0 15px;font-size:38.4px; font-weight: bold;}
.progress{text-align:center;font-size:21.6px;color:#444;margin-bottom:20px; font-weight: bold;}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:592px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 15px 45px rgba(0,0,0,.15);
  display:flex; flex-direction:column; padding:36px; border:3px solid #eee; overflow-y:auto;
}
.front{justify-content:flex-start; align-items:flex-start; text-align:left}
.back{transform:rotateY(180deg); text-align:left; align-items:flex-start; justify-content:flex-start; padding-top:40px;}

.hl{color: #7c2d12; font-weight: bold; background-color: #fef08a; padding: 2px 6px; border-radius: 4px; border: 1px solid #eab308;}
.hl-blue { color: #ffffff; font-weight: bold; background-color: #2563eb; padding: 2px 6px; border-radius: 4px; }
.hl-red { color: #dc2626; font-weight: bold; }

.formula-box {
  background-color: #f1f5f9;
  border-left: 4px solid #2563eb;
  padding: 8px 14px;
  margin: 8px 0;
  border-radius: 6px;
  font-family: Consolas, Monaco, monospace, Arial, "Microsoft YaHei";
  font-size: 0.95em;
  color: #1e293b;
  font-weight: bold;
}

/* Pinyin mặt trước: căn giữa */
.pinyin{
  font-size:1.68em;
  color:#666666;
  margin-bottom:10px;
  font-weight:bold;
  text-align:center;
  width:100%;
}

.zh-front { font-size: 2.16em; font-weight: bold; margin-bottom: 10px; line-height: 1.3; color: #dc2626; text-align: center; width: 100%; }

/* Mặt sau */
.zh-back { color: #2563eb; font-weight: bold; font-size: 1.74em; line-height: 1.25; display: block; margin-top: 12px; margin-bottom: 2px; }
.pinyin-back { color: #666666; font-weight: bold; font-size: 1.2em; display: block; margin: 2px 0; }
.vi-back { font-size: 1.2em; color: #333; display: block; margin-bottom: 14px; }

.desc-front { font-size: 1.38em; color: #333; margin: 8px 0; text-align: left; width: 100%; line-height: 1.5; }
.desc{font-size: 1.38em; color: #333; margin: 0; text-align: left; width: 100%; line-height: 1.4;}

.controls{display:flex;gap:20px;justify-content:center;margin-top:30px}
button{
  border:0;border-radius:20px;padding:20px 35px;font-size:26.4px;
  cursor:pointer;background:#e9eef7;color:#233044; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1);
}
button.primary{background:#2563eb;color:white}
</style>
</head>

<body>
<div class="app">
  <h1 id="title">BÀI 15 – NGỮ PHÁP</h1>
  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front" id="frontFace"></div>
      <div class="face back" id="backFace"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← TRƯỚC</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">LẬT THẺ</button>
    <button onclick="event.stopPropagation();nextCard()">TIẾP →</button>
  </div>
</div>

<script>
const cards = [
  {
    f: "<div class='zh-front'>ĐANG…<br><span class='hl'>在…</span></div>" +
       "<div class='desc-front'>" +
       "Dùng để diễn tả một hành động <span class='hl'>đang ở giai đoạn tiến hành</span>.<br><br>" +
       "<b>Các mẫu câu phổ biến</b>" +
       "<div class='formula-box'>Chủ ngữ + <span class='hl-red'>正在/在</span> + Động từ + (Tân ngữ) + <span class='hl-red'>(呢)</span></div>" +
       "<div class='formula-box'>Chủ ngữ + <span class='hl-red'>正</span> + Động từ + (Tân ngữ) + <span class='hl-red'>呢</span></div>" +
       "<div class='formula-box'>Chủ ngữ + Động từ + (Tân ngữ) + <span class='hl-red'>呢</span></div>" +
       "<b>Phủ định:</b> <span class='hl-blue'>没(有)/没在</span><br><br>" +
       "Hành động <b>\"đang\"</b> có thể xảy ra ở <b>hiện tại</b>, <b>quá khứ</b> hoặc <b>tương lai</b> tùy thuộc vào mốc thời gian được nhắc đến." +
       "</div>",
    b: "<div class='desc'>" +
       "<span class='zh-back'>他正在等他爱人呢。</span><span class='pinyin-back'>Tā zhèngzài děng tā àirén ne.</span><span class='vi-back'>(Anh ấy đang đợi người yêu của anh ấy đấy.)</span>" +
       "<span class='zh-back'>外面正下大雨呢。</span><span class='pinyin-back'>Wàimiàn zhèng xià dàyǔ ne.</span><span class='vi-back'>(Bên ngoài đang mưa to đấy.)</span>" +
       "<span class='zh-back'>小雨在给朋友打电话呢。</span><span class='pinyin-back'>Xiǎoyǔ zài gěi péngyou dǎ diànhuà ne.</span><span class='vi-back'>(Tiểu Vũ đang gọi điện cho bạn bè đấy.)</span>" +
       "<span class='zh-back'>他睡觉呢。</span><span class='pinyin-back'>Tā shuìjiào ne.</span><span class='vi-back'>(Anh ấy đang ngủ đấy.)</span>" +
       "<span class='zh-back'>莉莉正在看电视吗？</span><span class='pinyin-back'>Lìli zhèngzài kàn diànshì ma?</span><span class='vi-back'>(Lily đang xem tivi phải không?)</span>" +
       "<span class='zh-back'>莉莉没有看电视，她在给朋友打电话呢。</span><span class='pinyin-back'>Lìli méiyǒu kàn diànshì, tā zài gěi péngyou dǎ diànhuà ne.</span><span class='vi-back'>(Lily không xem tivi, cô ấy đang gọi điện cho bạn bè đấy.)</span>" +
       "<span class='zh-back'>没有，她没在看电视，她在给朋友打电话呢。</span><span class='pinyin-back'>Méiyǒu, tā méi zài kàn diànshì, tā zài gěi péngyou dǎ diànhuà ne.</span><span class='vi-back'></span>" +
       "<span class='zh-back'>昨天我去小雨家的时候，他正在听音乐呢。</span><span class='pinyin-back'>Zuótiān wǒ qù Xiǎoyǔ jiā de shíhou, tā zhèngzài tīng yīnyuè ne.</span><span class='vi-back'>(Hôm qua khi tôi đến nhà Tiểu Vũ, cậu ấy đang nghe nhạc.)</span>" +
       "<span class='zh-back'>明年的这个时候，你们在做什么呢？</span><span class='pinyin-back'>Míngnián de zhège shíhou, nǐmen zài zuò shénme ne?</span><span class='vi-back'>(Vào lúc này năm sau, các bạn đang làm gì?)</span>" +
       "<span class='zh-back'>她正在擦黑板呢。</span><span class='pinyin-back'>Tā zhèngzài cā hēibǎn ne.</span><span class='vi-back'>(Cô ấy đang lau bảng đấy.)</span>" +
       "</div>"
  },
  {
    f: "<div class='zh-front'>NGƯỜI THÌ… NGƯỜI THÌ…<br><span class='hl'>有的…有的…</span></div>" +
       "<div class='desc-front'>" +
       "Dùng để <span class='hl'>liệt kê một phần</span> trong một nhóm người hoặc một nhóm vật.<br><br>" +
       "<span class='hl-red'>有的</span> có thể dùng <b>một mình</b>, hoặc dùng <b>hai, ba lần liên tiếp</b> để liệt kê các nhóm khác nhau trong cùng một tập thể.<br><br>" +
       "<div class='formula-box'><span class='hl-red'>有的</span> + (Danh từ) + Động từ, <span class='hl-red'>有的</span> + (Danh từ) + Động từ</div>" +
       "</div>",
    b: "<div class='desc'>" +
       "<span class='zh-back'>商店里顾客真不少，有的正在挑东西，有的正在排队交钱。</span><span class='pinyin-back'>Shāngdiàn li gùkè zhēn bù shǎo, yǒude zhèngzài tiāo dōngxi, yǒude zhèngzài páiduì jiāo qián.</span><span class='vi-back'>(Trong cửa hàng khách thật đông, có người đang chọn đồ, có người đang xếp hàng thanh toán.)</span>" +
       "<span class='zh-back'>我们班的同学有的喜欢吃辣的，有的喜欢吃甜的。</span><span class='pinyin-back'>Wǒmen bān de tóngxué yǒude xǐhuan chī là de, yǒude xǐhuan chī tián de.</span><span class='vi-back'>(Các bạn lớp tôi có người thích ăn cay, có người thích ăn ngọt.)</span>" +
       "<span class='zh-back'>邮局里有不少人，有的正在寄信，有的正在买邮票。</span><span class='pinyin-back'>Yóujú li yǒu bù shǎo rén, yǒude zhèngzài jì xìn, yǒude zhèngzài mǎi yóupiào.</span><span class='vi-back'>(Trong bưu điện có khá nhiều người, có người đang gửi thư, có người đang mua tem.)</span>" +
       "<span class='zh-back'>这个鞋店很大，有的正在试鞋，有的正在排队交钱。</span><span class='pinyin-back'>Zhège xiédiàn hěn dà, yǒude zhèngzài shì xié, yǒude zhèngzài páiduì jiāo qián.</span><span class='vi-back'>(Tiệm giày này rất lớn, có người đang thử giày, có người đang xếp hàng trả tiền.)</span>" +
       "<span class='zh-back'>下课以后，有的同学去食堂吃饭，有的同学回宿舍休息。</span><span class='pinyin-back'>Xiàkè yǐhòu, yǒude tóngxué qù shítáng chīfàn, yǒude tóngxué huí sùshè xiūxi.</span><span class='vi-back'>(Sau khi tan học, có bạn đi căn tin ăn cơm, có bạn về ký túc xá nghỉ ngơi.)</span>" +
       "<span class='zh-back'>这是小雨买的苹果，有的很大，有的很小。</span><span class='pinyin-back'>Zhè shì Xiǎoyǔ mǎi de píngguǒ, yǒude hěn dà, yǒude hěn xiǎo.</span><span class='vi-back'>(Đây là táo Tiểu Vũ mua, có quả rất to, có quả rất nhỏ.)</span>" +
       "<span class='zh-back'>邮局里有不少人，有的正在寄信，有的正在买邮票。</span><span class='pinyin-back'>Yóujú li yǒu bù shǎo rén, yǒude zhèngzài jì xìn, yǒude zhèngzài mǎi yóupiào.</span><span class='vi-back'>(Trong bưu điện có khá nhiều người, có người đang gửi thư, có người đang mua tem.)</span>" +
       "</div>"
  },
  {
    f: "<div class='zh-front'>VỪA… VỪA…<br><span class='hl'>一边…一边…</span></div>" +
       "<div class='desc-front'>" +
       "Nối hai động từ để chỉ <span class='hl'>hai hành động xảy ra đồng thời</span>.<br>" +
       "<div class='formula-box'><span class='hl-red'>一边</span> + Động từ + <span class='hl-red'>一边</span> + Động từ</div>" +
       "Thường là <b>cùng chủ ngữ</b>.<br>" +
       "Nếu hai hành động <b>nối tiếp nhau</b> thì <span class='hl-blue'>không dùng</span> mẫu này." +
       "</div>",
    b: "<div class='desc'>" +
       "<span class='zh-back'>莉莉跟朋友们在房间里一边喝咖啡一边聊天儿。</span><span class='pinyin-back'>Lìli gēn péngyoumen zài fángjiān li yìbiān hē kāfēi yìbiān liáotiānr.</span><span class='vi-back'>(Lily và các bạn ở trong phòng vừa uống cà phê vừa trò chuyện.)</span>" +
       "<span class='zh-back'>彼得一边听音乐，一边吃饭。</span><span class='pinyin-back'>Bǐdé yìbiān tīng yīnyuè, yìbiān chīfàn.</span><span class='vi-back'>(Peter vừa nghe nhạc vừa ăn cơm.)</span>" +
       "<span class='zh-back'>我一边走路一边看手机。</span><span class='pinyin-back'>Wǒ yìbiān zǒulù yìbiān kàn shǒujī.</span><span class='vi-back'>(Tôi vừa đi đường vừa xem điện thoại.)</span>" +
       "<span class='zh-back'>他一边听音乐一边跑步。</span><span class='pinyin-back'>Tā yìbiān tīng yīnyuè yìbiān pǎobù.</span><span class='vi-back'>(Anh ấy vừa nghe nhạc vừa chạy bộ.)</span>" +
       "<span class='zh-back'>他一边喝茶一边看书。</span><span class='pinyin-back'>Tā yìbiān hē chá yìbiān kàn shū.</span><span class='vi-back'>(Anh ấy vừa uống trà vừa đọc sách.)</span>" +
       "<span class='zh-back'>她一边做饭一边唱歌。</span><span class='pinyin-back'>Tā yìbiān zuòfàn yìbiān chànggē.</span><span class='vi-back'>(Cô ấy vừa nấu ăn vừa hát.)</span>" +
       "<span class='zh-back'>他一边开车一边打电话。</span><span class='pinyin-back'>Tā yìbiān kāichē yìbiān dǎ diànhuà.</span><span class='vi-back'>(Anh ấy vừa lái xe vừa gọi điện thoại.)</span>" +
       "</div>"
  },
  {
    f: "<div class='zh-front'>CHỖ TÔI…<br><span class='hl'>我这儿</span></div>" +
       "<div class='desc-front'>" +
       "<span class='hl-red'>这儿</span> (chỗ này) và <span class='hl-red'>那儿</span> (chỗ kia) có thể kết hợp với <b>đại từ nhân xưng</b> hoặc <b>danh từ không chỉ nơi chốn</b> để tạo thành <span class='hl'>cụm từ chỉ địa điểm</span>.<br><br>" +
       "• <span class='hl-red'>…这儿</span> chỉ nơi <b>gần gũi</b> (gần người nói)<br>" +
       "• <span class='hl-red'>…那儿</span> chỉ chỗ ở <b>xa người nói hơn</b>." +
       "</div>",
    b: "<div class='desc'>" +
       "<span class='zh-back'>刚才我去他那儿的时候，他正在给一家公司打电话。</span><span class='pinyin-back'>Gāngcái wǒ qù tā nàr de shíhou, tā zhèngzài gěi yì jiā gōngsī dǎ diànhuà.</span><span class='vi-back'>(Lúc nãy khi tôi đến chỗ cậu ấy, cậu ấy đang gọi điện cho một công ty.)</span>" +
       "</div>"
  }
];

let idx = 0;

function render() {
  const frontEl = document.getElementById('frontFace');
  const backEl = document.getElementById('backFace');
  frontEl.innerHTML = cards[idx].f;
  backEl.innerHTML = cards[idx].b;
  frontEl.scrollTop = 0;
  backEl.scrollTop = 0;
  document.getElementById('progress').innerText = `Thẻ ${idx + 1} / ${cards.length}`;
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  idx = (idx + 1) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function prevCard() {
  idx = (idx - 1 + cards.length) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    nextCard();
    event.preventDefault();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    prevCard();
    event.preventDefault();
  } else if (event.key === ' ' || event.key === 'Enter') {
    flipCard();
    event.preventDefault();
  }
});

render();
</script>
</body>
</html>
