<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 15 – TỪ MỚI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f9fbff);
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(720px,94vw); padding:28px 0 36px}
h1{text-align:center;margin:0 0 8px;font-size:28px}
.subtitle{text-align:center;color:#666;margin-bottom:18px}
.progress{text-align:center;font-size:15px;color:#666;margin-bottom:14px}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:489px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 12px 35px rgba(30,60,100,.15);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:30px; border:1px solid #e6eaf0; text-align:center;
}
.zh{
  color: #e53e3e;
  font-weight: bold;
}
.front .han{font-size:168px; line-height: 1.2;}
.front .han.long-front{font-size:74px;}
.front .han.med-front{font-size:112px;}
.front .hint{margin-top:28px;color:#999;font-size:28px}

.back{transform:rotateY(180deg); justify-content:flex-start; padding-top:20px; overflow-y:auto;}
.back .han{font-size:108px; margin-bottom:4px; line-height: 1.2;}
.back .han.long-back{font-size:56px;}
.back .han.med-back{font-size:78px;}
.pinyin{font-size:65px;font-weight:700;color:#2b6cb0;margin-bottom:4px}
.pinyin.long-pinyin{font-size:38px;}
.pinyin.med-pinyin{font-size:48px;}
.pos{font-size:29px;font-style:italic;color:#718096;margin-bottom:6px}
.meaning{font-size:36px;color:#2d3748;font-weight:500;margin-bottom:10px}
.note{font-size:24px;color:#4a5568;background:#f7fafc;padding:10px 14px;border-radius:12px;border-left:4px solid #cbd5e0;max-width:90%;margin:0 auto;line-height:1.4;text-align:left;}
.note i{font-style:italic;}
.controls{display:flex;gap:12px;justify-content:center;margin-top:22px}
button{
  border:0;border-radius:14px;padding:13px 20px;font-size:16px;
  cursor:pointer;background:#e9eef7;color:#233044;
}
button.primary{background:#2563eb;color:white}
button:hover{filter:brightness(.97)}
.extra{display:flex;justify-content:center;gap:10px;margin-top:14px}
.speak{background:#fff4d6}
.shuffle{background:#e9f8ef}
@media(max-width:520px){
 .app{padding-top:20px}.card{height:435px}
 .front .han{font-size:108px}
 .front .han.long-front{font-size:46px}
 .front .han.med-front{font-size:72px}
 .front .hint{font-size:22px}
 .back .han{font-size:72px}
 .back .han.long-back{font-size:38px}
 .back .han.med-back{font-size:52px}
 .pinyin{font-size:43px}
 .pinyin.long-pinyin{font-size:26px}
 .pinyin.med-pinyin{font-size:34px}
 .pos{font-size:24px}
 .meaning{font-size:29px}
 .note{font-size:19px; padding:8px 10px;}
 .controls button{padding:12px 14px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🇨🇳 BÀI 15 – TỪ MỚI</h1>

  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front">
        <div class="han zh" id="frontHan"></div>
      </div>
      <div class="face back">
        <div class="han zh" id="backHan"></div>
        <div class="pinyin" id="pinyin"></div>
        <div class="pos" id="pos"></div>
        <div class="meaning" id="meaning"></div>
        <div class="note" id="note" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← Trước</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">Lật thẻ</button>
    <button onclick="event.stopPropagation();nextCard()">Tiếp →</button>
  </div>
  <div class="extra">
    <button class="speak" onclick="event.stopPropagation();speak()">🔊 Nghe phát âm</button>
    <button class="shuffle" onclick="event.stopPropagation();shuffleCards()">🔀 Trộn từ</button>
  </div>
</div>

<script>
const originalCards = [
  { "han": "家", "pinyin": "jiā", "pos": "lượng từ", "meaning": "quán, nhà", "note": "lượng từ dùng cho cửa hàng, tiệm, siêu thị…" },
  { "han": "正在", "pinyin": "zhèngzài", "pos": "phó từ", "meaning": "đang", "note": "diễn ra" },
  { "han": "打折", "pinyin": "dǎ zhé", "pos": "động từ", "meaning": "giảm giá, bán hạ giá", "note": "" },
  { "han": "顾客", "pinyin": "gùkè", "pos": "danh từ", "meaning": "khách hàng", "note": "" },
  { "han": "少", "pinyin": "shǎo", "pos": "tính từ", "meaning": "ít, vài", "note": "" },
  { "han": "有的", "pinyin": "yǒude", "pos": "đại từ", "meaning": "có người, có cái", "note": "chỉ một số" },
  { "han": "挑", "pinyin": "tiāo", "pos": "động từ", "meaning": "chọn, lựa", "note": "" },
  { "han": "排队", "pinyin": "pái duì", "pos": "động từ", "meaning": "xếp hàng", "note": "" },
  { "han": "交", "pinyin": "jiāo", "pos": "động từ", "meaning": "trả (tiền), nộp", "note": "" },
  { "han": "咦", "pinyin": "yí", "pos": "thán từ", "meaning": "ồ, hử", "note": "thể hiện sự ngạc nhiên, tò mò" },
  { "han": "先生", "pinyin": "xiānsheng", "pos": "danh từ", "meaning": "ông, ngài, tiên sinh", "note": "" },
  { "han": "找", "pinyin": "zhǎo", "pos": "động từ", "meaning": "tìm, tìm kiếm", "note": "" },
  { "han": "刚才", "pinyin": "gāngcái", "pos": "danh từ", "meaning": "vừa nãy, lúc nãy", "note": "" },
  { "han": "打（电话）", "pinyin": "dǎ (diànhuà)", "pos": "động từ", "meaning": "gọi (điện thoại)", "note": "" },
  { "han": "招聘", "pinyin": "zhāopìn", "pos": "động từ", "meaning": "tuyển dụng, chiêu mộ", "note": "nhân viên" },
  { "han": "打算", "pinyin": "dǎsuàn", "pos": "động từ, danh từ", "meaning": "dự định, kế hoạch", "note": "" },
  { "han": "应聘", "pinyin": "yìngpìn", "pos": "động từ", "meaning": "ứng tuyển, nhận lời mời làm việc", "note": "" },
  { "han": "外边", "pinyin": "wàibian", "pos": "danh từ", "meaning": "bên ngoài", "note": "" },
  { "han": "下（雨）", "pinyin": "xià (yǔ)", "pos": "động từ", "meaning": "mưa, (trời) đổ mưa", "note": "" },
  { "han": "雨", "pinyin": "yǔ", "pos": "danh từ", "meaning": "mưa", "note": "" },
  { "han": "一边……一边……", "pinyin": "yìbiān…… yìbiān……", "pos": "liên từ", "meaning": "vừa……vừa……", "note": "(đồng thời)" },
  { "han": "聊天儿", "pinyin": "liáo tiānr", "pos": "động từ", "meaning": "tán gẫu, nói chuyện phiếm", "note": "" },
  { "han": "大家", "pinyin": "dàjiā", "pos": "đại từ", "meaning": "mọi người, tất cả", "note": "" },
  { "han": "明年", "pinyin": "míngnián", "pos": "danh từ", "meaning": "năm sau, năm tới", "note": "" },
  { "han": "可能", "pinyin": "kěnéng", "pos": "trợ động từ", "meaning": "có thể, có lẽ", "note": "" },
  { "han": "旅行", "pinyin": "lǚxíng", "pos": "động từ", "meaning": "du lịch, đi ngao du", "note": "" },
  { "han": "回答", "pinyin": "huídá", "pos": "động từ", "meaning": "trả lời, đáp lại", "note": "" },
  { "han": "猜", "pinyin": "cāi", "pos": "động từ", "meaning": "đoán, phỏng đoán", "note": "" },
  { "han": "擦", "pinyin": "cā", "pos": "động từ", "meaning": "lau, chùi", "note": "" },
  { "han": "黑板", "pinyin": "hēibǎn", "pos": "danh từ", "meaning": "bảng đen", "note": "" },
  { "han": "音乐", "pinyin": "yīnyuè", "pos": "danh từ", "meaning": "âm nhạc", "note": "" },
  { "han": "信", "pinyin": "xìn", "pos": "danh từ", "meaning": "thư từ, bức thư", "note": "" },
  { "han": "寄", "pinyin": "jì", "pos": "động từ", "meaning": "gửi", "note": "thư" },
  { "han": "邮票", "pinyin": "yóupiào", "pos": "danh từ", "meaning": "tem thư", "note": "" },
  { "han": "安娜", "pinyin": "Ānnà", "pos": "danh từ riêng", "meaning": "Anna", "note": "" }
];

let cards = [...originalCards];
let index = 0;
let flipped = false;

function render(){
  const c = cards[index];
  const frontHanEl = document.getElementById('frontHan');
  const backHanEl = document.getElementById('backHan');
  const pinyinEl = document.getElementById('pinyin');

  frontHanEl.textContent = c.han;
  backHanEl.textContent = c.han;
  pinyinEl.textContent = c.pinyin;

  frontHanEl.className = 'han zh';
  backHanEl.className = 'han zh';
  pinyinEl.className = 'pinyin';

  if (c.han.length >= 7) {
    frontHanEl.classList.add('long-front');
    backHanEl.classList.add('long-back');
  } else if (c.han.length >= 4) {
    frontHanEl.classList.add('med-front');
    backHanEl.classList.add('med-back');
  }

  if (c.pinyin.length >= 16) {
    pinyinEl.classList.add('long-pinyin');
  } else if (c.pinyin.length >= 11) {
    pinyinEl.classList.add('med-pinyin');
  }

  document.getElementById('pos').textContent = c.pos;
  document.getElementById('meaning').innerHTML = c.meaning;
  
  const noteEl = document.getElementById('note');
  if(c.note && c.note.trim() !== ""){
    noteEl.innerHTML = c.note;
    noteEl.style.display = "block";
  } else {
    noteEl.style.display = "none";
  }

  document.getElementById('progress').textContent = `Từ ${index+1} / ${cards.length}`;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function flipCard(){
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function nextCard(){
  index = (index + 1) % cards.length;
  flipped = false; render();
}

function prevCard(){
  index = (index - 1 + cards.length) % cards.length;
  flipped = false; render();
}

function shuffleCards(){
  for(let i=cards.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  index=0; flipped=false; render();
}

function speak(){
  const text=cards[index].han.replace(/[（）…]/g, '');
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=.75;
    speechSynthesis.speak(u);
  }else{
    alert('Trình duyệt của bạn không hỗ trợ phát âm.');
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextCard();
  else if(e.key==='ArrowLeft') prevCard();
  else if(e.key===' ' || e.key==='Enter'){
    e.preventDefault();
    flipCard();
  }
});

render();
</script>
</body>
</html>
